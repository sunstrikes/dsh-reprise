<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>reprise — read-only dashboard</title>
    <!--
      One stylesheet, served beside this page by the host at `/api/reprise/dashboard.css`. It carries
      the `--reprise-*` token block (falling back to the host's `--dsw-alias-*` then to CSS system
      colours) and every component the page draws, and the Web UI panel injects the same file in
      ticket #6. There is no second `<style>` here on purpose: two places to paint one page is how
      the two clients drifted apart the first time.
    -->
    <link rel="stylesheet" href="./dashboard.css" />
  </head>
  <body class="reprise">
    <header class="masthead">
      <h1>reprise</h1>
      <span class="meta" id="workspace"></span>
      <span class="meta" id="status">connecting…</span>
      <span class="meta" id="cursor"></span>
    </header>

    <!--
      The conclusion line, first: the best result, what it is measured against, and by how much. The
      page's own title sits above it in the masthead; everything below is evidence for this.
    -->
    <section class="headline" id="headline" aria-live="polite">
      <p class="headline-empty">waiting for facts…</p>
    </section>

    <!--
      The staircase and the round rail, in place of the old Rounds table. It sits between the
      conclusion and the cards because it is the evidence for the conclusion: which round raised the
      best result, which rounds held, and which candidate is still running.
    -->
    <section class="card" id="ladder">
      <h2>Best so far, round by round</h2>
      <p class="empty">waiting for facts…</p>
    </section>

    <div class="grid">
      <section class="card" id="overview" aria-live="polite">
        <h2>Overview</h2>
        <p class="empty">waiting for facts…</p>
      </section>

      <section class="card" id="conclusion" aria-live="polite">
        <h2>Conclusion</h2>
        <p class="empty">waiting for facts…</p>
      </section>

      <section class="card" id="candidate" aria-live="polite">
        <h2>Candidate</h2>
        <p class="empty">choose a candidate from a round.</p>
      </section>

      <section class="card" id="audit" aria-live="polite">
        <h2>Model calls</h2>
        <p class="empty">no judgement has asked a model yet.</p>
      </section>

      <section class="card" id="stream" aria-live="polite">
        <h2>New facts</h2>
        <p class="empty">nothing yet.</p>
      </section>
    </div>

    <script type="module" src="./dashboard.js"></script>
  </body>
</html>
